<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>紙片句子接龍</title>
<style>
:root{
  --canvas:#FFF8E8; --paper:#FFFDF5; --deep:#F5EEDC; --ink:#263143; --muted:#687180;
  --voltage:#FF5C5C; --teal:#4ECDC4; --yellow:#FFD166; --violet:#A78BFA; --success:#4CAF50;
  --c-action:#FFB3A7; --c-fn:#FFFDF5; --c-punct:#EFEBE0; --pm:#8A8272;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --pin:"Atkinson Hyperlegible","Nunito","Verdana",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--canvas); color:var(--ink); font-family:var(--sans);
  background-image:radial-gradient(rgba(38,49,67,.07) 1.1px, transparent 1.1px);
  background-size:22px 22px;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none;
}
button{font-family:inherit}
:focus-visible{outline:4px solid #2F80ED; outline-offset:2px}

#app{
  height:100dvh; max-width:920px; margin:0 auto;
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px;
}
/* ---------- header ---------- */
.rail{display:flex; align-items:center; gap:8px; height:58px; flex:0 0 auto}
.brand{display:flex; align-items:center; gap:8px; font-size:20px; font-weight:800; letter-spacing:.02em}
.brand svg{width:30px; height:30px}
.spacer{flex:1}
.progress{
  background:var(--yellow); border:2px solid var(--ink); border-radius:999px;
  padding:5px 14px; font-weight:800; font-size:15px; box-shadow:0 3px 0 var(--ink); white-space:nowrap;
}
.iconbtn{
  width:48px; height:48px; border:3px solid var(--ink); border-radius:15px; background:var(--paper);
  box-shadow:0 3px 0 var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:transform .12s, box-shadow .12s; touch-action:manipulation;
}
.iconbtn svg{width:24px; height:24px}
.iconbtn:hover{transform:translateY(-2px); box-shadow:0 5px 0 var(--ink)}
.iconbtn:active{transform:translateY(2px); box-shadow:0 0 0 var(--ink)}
.hint{margin:0; text-align:center; font-size:14px; font-weight:700; color:var(--muted); flex:0 0 auto}

/* ---------- stage ---------- */
.stage{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:8px}
.tray{
  position:relative; flex:0 1 auto; min-height:132px; max-height:46%;
  background:var(--paper); border:3px solid var(--ink); border-radius:28px 28px 18px 18px;
  padding:14px 12px; display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:9px;
  overflow:auto; touch-action:pan-y; transition:box-shadow .3s, border-color .3s;
}
.tray::before{
  content:""; position:absolute; inset:10px; border:2px dashed rgba(38,49,67,.16); border-radius:20px;
  pointer-events:none; transition:opacity .3s;
}
.tray.has::before{opacity:0}
.tray.solved{border-color:var(--voltage); box-shadow:0 0 0 5px rgba(255,92,92,.26), 0 4px 0 var(--ink)}
.tray.solved::before{opacity:0}

.feedback{
  min-height:40px; display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:16px; font-weight:700; color:var(--ink); flex:0 0 auto;
}
.feedback .pill{
  background:var(--deep); border:2px solid var(--ink); border-radius:999px; padding:6px 16px;
  animation:rise .28s cubic-bezier(.22,1,.36,1);
}
.feedback.good .pill{background:#FFE9A8}

.bankwrap{
  flex:1 1 auto; min-height:112px; display:flex; flex-direction:column;
  background:#E7F7F5; border:3px solid var(--teal); border-radius:18px 18px 26px 26px; overflow:hidden;
}
.bankbar{display:flex; align-items:center; justify-content:space-between; padding:5px 10px 3px}
.chip{
  background:var(--teal); border:2px solid var(--ink); border-radius:999px; padding:3px 12px;
  font-size:13px; font-weight:800; box-shadow:0 2px 0 var(--ink);
}
.scrollbtns{display:flex; gap:6px}
.scrollbtn{
  width:44px; height:34px; border:2px solid var(--ink); border-radius:11px; background:var(--paper);
  cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 0 var(--ink);
  touch-action:manipulation;
}
.scrollbtn svg{width:18px;height:18px}
.scrollbtn:active{transform:translateY(2px); box-shadow:0 0 0 var(--ink)}
.bank{
  flex:1 1 auto; min-height:0; overflow:auto; touch-action:pan-y;
  display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:9px; padding:6px 10px 12px;
}
.actions{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; flex:0 0 auto}

.btn{
  min-height:56px; min-width:56px; padding:0 18px; font-size:17px; font-weight:800; color:var(--ink);
  border:3px solid var(--ink); border-radius:18px; background:var(--paper); box-shadow:0 4px 0 var(--ink);
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s, box-shadow .12s; touch-action:manipulation;
}
.btn svg{width:22px;height:22px}
.btn:hover{transform:translateY(-2px); box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--voltage)}
.btn.teal{background:#B7ECE8}
.btn[disabled]{opacity:.42; transform:none; box-shadow:0 4px 0 var(--ink); cursor:default}
.btn[hidden]{display:none}

/* ---------- tile ---------- */
.tile{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; min-height:64px; min-width:58px; padding:7px 12px 8px;
  border:2px solid var(--ink); border-radius:18px; background:var(--fill,var(--c-fn));
  box-shadow:0 4px 0 var(--ink); cursor:grab; touch-action:none;
  transition:transform .14s cubic-bezier(.22,1,.36,1), box-shadow .14s;
  color:var(--ink);
}
.tile:hover{transform:translateY(-5px) scale(1.03); box-shadow:0 7px 0 var(--ink)}
.tile:active{cursor:grabbing}
.tile .meta{
  font-family:var(--pin); font-size:9.5px; font-weight:700; line-height:11px; color:var(--pm);
  letter-spacing:.01em; max-height:12px; overflow:hidden; transition:opacity .25s, max-height .25s;
  white-space:nowrap;
}
.tile .py{font-family:var(--pin); font-size:13px; font-weight:700; line-height:15px; white-space:nowrap}
.tile .hz{font-size:clamp(26px,6vw,34px); font-weight:700; line-height:1.1}
.tile.cat-q{min-width:48px; padding:7px 10px}
.tile.cat-q .hz{font-size:clamp(24px,5.5vw,30px)}
.tile.dragging{opacity:.22}
.tile.locked{cursor:default}
.tile.locked:hover{transform:none; box-shadow:0 4px 0 var(--ink)}
.tray.solved .tile .meta{opacity:0; max-height:0}
.tray.solved .tile{box-shadow:0 3px 0 var(--ink)}

.ph{
  border:2px dashed var(--muted); border-radius:18px; background:rgba(38,49,67,.06);
  min-height:64px; min-width:58px;
}
.ghost{position:fixed; z-index:120; pointer-events:none; margin:0;
  transform:translate(-50%,-50%) rotate(-3deg) scale(1.05); box-shadow:0 8px 0 var(--ink); opacity:.96}

@keyframes drop{0%{transform:translateY(-12px) rotate(-5deg)}60%{transform:translateY(3px) rotate(2deg)}100%{transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:translateY(-10px) scale(1.07)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(8px); opacity:0}to{transform:none; opacity:1}}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.anim-drop{animation:drop .2s cubic-bezier(.34,1.56,.64,1)}
.anim-pop{animation:pop .56s cubic-bezier(.22,1,.36,1)}
.anim-wobble{animation:wobble .32s ease-in-out 2}

/* ---------- cheer + confetti ---------- */
#cheer{position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  pointer-events:none; z-index:110}
#cheer.show{display:flex}
.cheer-card{
  background:var(--paper); border:4px solid var(--ink); border-radius:30px; padding:18px 34px;
  box-shadow:0 10px 0 var(--ink); text-align:center;
  animation:drop .5s cubic-bezier(.34,1.56,.64,1);
}
.cheer-stars{display:flex; gap:10px; justify-content:center; margin-bottom:4px}
.cheer-stars span{width:26px; height:26px; background:var(--yellow); border:2px solid var(--ink);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
.cheer-stars span:nth-child(2){background:var(--voltage); animation-delay:.08s}
.cheer-stars span:nth-child(3){background:var(--teal); animation-delay:.16s}
.cheer-big{font-size:clamp(34px,9vw,56px); font-weight:800; line-height:1.1}
.cheer-sub{font-size:18px; font-weight:800; color:var(--voltage)}
#fx{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:105}
.conf{position:absolute; top:-30px; border:2px solid var(--ink); border-radius:4px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(680deg)}}

/* ---------- settings sheet ---------- */
.sheet{position:fixed; inset:0; background:rgba(38,49,67,.35); display:flex; align-items:center;
  justify-content:center; z-index:130; padding:20px}
.sheet[hidden]{display:none}
.sheet-card{background:var(--paper); border:4px solid var(--ink); border-radius:26px; padding:20px;
  max-width:420px; width:100%; box-shadow:0 10px 0 var(--ink); animation:drop .35s cubic-bezier(.34,1.56,.64,1)}
.sheet-card h2{margin:0 0 10px; font-size:22px}
.sheet-card p{margin:6px 0; font-size:15px; font-weight:600; color:var(--ink)}
.sheet-row{display:flex; gap:8px; margin-top:16px; justify-content:flex-end; flex-wrap:wrap}

@media (max-width:420px){
  .brand span{display:none}
  .btn{font-size:16px; padding:0 14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important}
}
</style>
</head>
<body>
<div id="app">
  <header class="rail">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="3" width="26" height="26" rx="8" fill="#FFD166" stroke="#263143" stroke-width="2.5"/>
        <circle cx="16" cy="3.5" r="4" fill="#FFFDF5" stroke="#263143" stroke-width="2.5"/>
        <path d="M11 20c2-4 8-4 10 0" fill="none" stroke="#263143" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>紙片句子接龍</span>
    </div>
    <div class="spacer"></div>
    <div class="progress" id="progress">第 1 題</div>
    <button class="iconbtn" id="btnSettings" title="朗讀設定" aria-label="朗讀設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="#263143" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8.5a5 5 0 0 1 0 7"/><path d="M19.5 6a8 8 0 0 1 0 12"/>
      </svg>
    </button>
  </header>

  <p class="hint">把詞語排成一句話</p>

  <main class="stage">
    <section class="tray" id="tray"></section>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

    <section class="bankwrap">
      <div class="bankbar">
        <span class="chip">詞語庫</span>
        <div class="scrollbtns">
          <button class="scrollbtn" data-dir="-1" title="向上捲動" aria-label="向上捲動">
            <svg viewBox="0 0 24 24" fill="none" stroke="#263143" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
          </button>
          <button class="scrollbtn" data-dir="1" title="向下捲動" aria-label="向下捲動">
            <svg viewBox="0 0 24 24" fill="none" stroke="#263143" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <div class="bank" id="bank"></div>
    </section>

    <div class="actions">
      <button class="btn primary" id="btnCheck">
        <svg viewBox="0 0 24 24" fill="none" stroke="#263143" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>檢查答案</button>
      <button class="btn teal" id="btnAgain">
        <svg viewBox="0 0 24 24" fill="none" stroke="#263143" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg>再聽一次</button>
      <button class="btn" id="btnReset">
        <svg viewBox="0 0 24 24" fill="none" stroke="#263143" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>重設</button>
      <button class="btn primary" id="btnNext" hidden>
        下一題<svg viewBox="0 0 24 24" fill="none" stroke="#263143" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg></button>
    </div>
  </main>
</div>

<div id="fx" aria-hidden="true"></div>

<div id="cheer" aria-hidden="true">
  <div class="cheer-card">
    <div class="cheer-stars"><span></span><span></span><span></span></div>
    <div class="cheer-big">太棒了！</div>
    <div class="cheer-sub">答對了！</div>
  </div>
</div>

<div class="sheet" id="settings" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-label="朗讀設定">
    <h2>朗讀設定</h2>
    <p id="voiceInfo">目前聲音：檢查中…</p>
    <p id="speechNote"></p>
    <div class="sheet-row">
      <button class="btn teal" id="btnTest">測試朗讀</button>
      <button class="btn" id="btnClose">關閉</button>
    </div>
  </div>
</div>

];

/* 補上句型中的固定複合詞 */
WORDS["美好"] = "měi hǎo;f";
WORDS["回憶"] = "huí yì;o";

/* =====================================================================
   3. 句庫產生（固定句型 × 固定詞彙 → 預設自然句）
   ===================================================================== */
function rnd(n){ return Math.floor(Math.random()*n); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(i+1),t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function buildSentence(frame){
  var chosen={}, used={}, out=[];
  for(var i=0;i<frame.length;i++){
    var raw=frame[i];
    if(raw.charAt(0)!=='$'){ out.push(raw); continue; }
    var name=raw.slice(1), base=name.split('.')[0], pool=P[base];
    if(chosen[name]===undefined){
      var avail=[], u=used[base]||(used[base]=[]);
      for(var k=0;k<pool.length;k++){ if(u.indexOf(pool[k])<0) avail.push(pool[k]); }
      if(!avail.length) avail=pool;
      var v=avail[rnd(avail.length)];
      chosen[name]=v; u.push(v);
    }
    out.push(chosen[name]);
  }
  return out;
}

function buildDatabase(target){
  var seen={}, db=[], progress=true;
  while(db.length<target && progress){
    progress=false;
    for(var f=0; f<FRAMES.length && db.length<target; f++){
      for(var tries=0; tries<14 && db.length<target; tries++){
        var s=buildSentence(FRAMES[f]), key=s.join('');
        if(!seen[key]){ seen[key]=1; db.push(s); progress=true; break; }
      }
    }
  }
  return db;
}
var DB = buildDatabase(1200);

/* =====================================================================
   4. 拼音：聲母／韻母拆解
   ===================================================================== */
var INITIALS=["zh","ch","sh","b","p","m","f","d","t","n","l","g","k","h","j","q","x","r","z","c","s","y","w"];
function splitSyl(s){
  if(!s) return ["",""];
  var low=s.toLowerCase();
  for(var i=0;i<INITIALS.length;i++){
    var ini=INITIALS[i];
    if(low.indexOf(ini)===0 && s.length>ini.length) return [s.slice(0,ini.length), s.slice(ini.length)];
  }
  return ["零聲母", s];
}
function metaFor(p){
  if(!p) return "";
  var syl=p.split(" ");
  if(syl.length>2) return "";
  return syl.map(function(s){ var a=splitSyl(s); return a[0]+" + "+a[1]; }).join("   ·   ");
}
function tokenInfo(text){
  var raw=WORDS[text];
  if(!raw){ console.warn("缺少詞彙：", text); return {t:text,p:"",cat:"g"}; }
  var i=raw.lastIndexOf(";");
  return { t:text, p:raw.slice(0,i), cat:raw.slice(i+1) };
}

/* =====================================================================
   5. 語音（Web Speech API）
   ===================================================================== */
var speechOK = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
var voice=null, lastSpoken=null;
function pickVoice(){
  if(!speechOK) return;
  var all=window.speechSynthesis.getVoices()||[], zh=[];
  for(var i=0;i<all.length;i++){ if(/^zh/i.test(all[i].lang||"")) zh.push(all[i]); }
  function find(re){ for(var i=0;i<zh.length;i++){ if(re.test(zh[i].lang)) return zh[i]; } return null; }
  voice = find(/zh[-_]TW/i) || find(/zh[-_]CN/i) || find(/^zh(?![-_]HK)/i) || zh[0] || null;
  updateVoiceInfo();
}
if(speechOK){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
  setTimeout(pickVoice, 400); setTimeout(pickVoice, 1200);
}
function setupUtter(u){
  if(voice){ u.voice=voice; u.lang=voice.lang; } else { u.lang="zh-TW"; }
  u.rate=0.82; u.pitch=1.05; u.volume=1;
}
function speak(text){
  if(!speechOK){ feedback("這台裝置目前不支援朗讀，可以看著拼音練習。"); return; }
  lastSpoken={type:"token", text:text};
  window.speechSynthesis.cancel();
  setTimeout(function(){
    var u=new SpeechSynthesisUtterance(text); setupUtter(u); window.speechSynthesis.speak(u);
  },60);
}
function speakSentence(){
  if(!speechOK){ feedback("這台裝置目前不支援朗讀，可以看著拼音練習。"); return; }
  var text=STATE.text;
  lastSpoken={type:"sentence", text:text};
  var parts=text.match(/[^，。！？]+[，。！？]?/g)||[text];
  window.speechSynthesis.cancel();
  var i=0;
  function next(){
    if(i>=parts.length) return;
    var s=parts[i++];
    var u=new SpeechSynthesisUtterance(s); setupUtter(u);
    var gap=/[。！？]$/.test(s)?420:260;
    u.onend=function(){ if(i<parts.length) setTimeout(next, gap); };
    u.onerror=u.onend;
    window.speechSynthesis.speak(u);
  }
  setTimeout(next, 90);
}
function noSpeech(){ feedback("這台裝置目前不支援朗讀，可以看著拼音練習。"); }

/* =====================================================================
   6. 狀態與畫面
   ===================================================================== */
var trayEl=$("#tray"), bankEl=$("#bank"), fbEl=$("#feedback"), fxEl=$("#fx"), cheerEl=$("#cheer");
var STATE={ tokens:[], text:"", solved:false, n:1, order:[] };
var dbShuffle = shuffle(DB.slice());

function pickPuzzle(){
  if(!dbShuffle.length) dbShuffle = shuffle(DB.slice());
  return dbShuffle.pop();
}

function makeTile(uid){
  var tk=STATE.tokens[uid];
  var el=document.createElement("button");
  el.type="button";
  el.className="tile cat-"+tk.cat;
  el.dataset.uid=uid;
  el.setAttribute("aria-label", tk.t + "，拼音 " + (tk.p || "標點符號"));
  el.style.setProperty("--fill", fillOf(tk.cat));
  el.innerHTML='<span class="meta">'+metaFor(tk.p)+'</span><span class="py">'+tk.p+'</span><span class="hz">'+tk.t+'</span>';
  return el;
}
function fillOf(c){
  if(c==="t") return "#FFD166";
  if(c==="p"||c==="f") return "#A78BFA";
  if(c==="o"||c==="n") return "#4ECDC4";
  if(c==="a") return "#FFB3A7";
  if(c==="q") return "#EFEBE0";
  return "#FFFDF5";
}

function newPuzzle(){
  var sent=pickPuzzle();
  STATE.tokens=sent.map(tokenInfo);
  STATE.text=sent.join('');
  STATE.solved=false;
  trayEl.innerHTML=""; bankEl.innerHTML="";
  trayEl.className="tray";
  var idxs=shuffle(STATE.tokens.map(function(_,i){ return i; }));
  idxs.forEach(function(i){ bankEl.appendChild(makeTile(i)); });
  $("#progress").textContent="第 "+STATE.n+" 題";
  $("#btnCheck").disabled=false; $("#btnReset").disabled=false; $("#btnNext").hidden=true;
  feedback("",false);
  syncHas();
}
function syncHas(){ trayEl.classList.toggle("has", trayEl.children.length>0); }

function feedback(txt, good){
  if(!txt){ fbEl.innerHTML=""; fbEl.classList.remove("good"); return; }
  fbEl.innerHTML='<span class="pill">'+txt+'</span>';
  fbEl.classList.toggle("good", !!good);
}

/* ---------- 拖曳 ---------- */
var drag=null;
function containerAt(x,y){
  var list=[trayEl, bankEl];
  for(var i=0;i<list.length;i++){
    var r=list[i].getBoundingClientRect();
    if(x>=r.left && x<=r.right && y>=r.top-4 && y<=r.bottom+4) return list[i];
  }
  return null;
}
function indexAt(c,x,y){
  var kids=c.children, before=0;
  for(var i=0;i<kids.length;i++){
    var el=kids[i];
    if(!el.classList.contains("tile")) continue;
    if(drag && el===drag.tile) continue;
    var r=el.getBoundingClientRect();
    var cx=r.left+r.width/2, cy=r.top+r.height/2;
    var isBefore = (cy < y-6) || (Math.abs(y-cy) < r.height/2 && cx < x);
    if(isBefore) before++;
  }
  return before;
}
function flip(mutate){
  if(RM || !document.body.animate){ mutate(); return; }
  var els=[].slice.call(document.querySelectorAll("#tray > .tile, #bank > .tile"));
  var first=els.map(function(e){ return e.getBoundingClientRect(); });
  mutate();
  els.forEach(function(e,i){
    var r=e.getBoundingClientRect(), f=first[i];
    var dx=f.left-r.left, dy=f.top-r.top;
    if(!dx && !dy) return;
    if(!e.animate) return;
    e.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],
              {duration:220, easing:"cubic-bezier(.22,1,.36,1)"});
  });
}
function placePlaceholder(c, index){
  flip(function(){
    var ph=drag.ph, tiles=[];
    for(var i=0;i<c.children.length;i++){ if(c.children[i].classList.contains("tile") && c.children[i]!==drag.tile) tiles.push(c.children[i]); }
    c.insertBefore(ph, tiles[index] || null);
    drag.target=c;
  });
}
function autoScroll(c, y){
  var r=c.getBoundingClientRect();
  if(y < r.top+44) c.scrollTop -= 12;
  else if(y > r.bottom-44) c.scrollTop += 12;
}
function onDown(e){
  if(STATE.solved) return;
  var tile=e.target.closest ? e.target.closest(".tile") : null;
  if(!tile) return;
  if(e.pointerType==="mouse" && e.button!==0) return;
  drag={ tile:tile, id:e.pointerId, x0:e.clientX, y0:e.clientY, active:false,
         ph:null, ghost:null, target:tile.parentElement, moved:false };
  try{ tile.setPointerCapture(e.pointerId); }catch(err){}
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onCancel);
  e.preventDefault();
}
function onMove(e){
  if(!drag || e.pointerId!==drag.id) return;
  var dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(!drag.active){
    if(Math.abs(dx)<7 && Math.abs(dy)<7) return;
    drag.active=true;
    var r=drag.tile.getBoundingClientRect();
    var g=drag.tile.cloneNode(true);
    g.className=drag.tile.className+" ghost";
    g.style.width=r.width+"px"; g.style.height=r.height+"px";
    document.body.appendChild(g);
    drag.ghost=g;
    drag.ph=document.createElement("div");
    drag.ph.className="ph";
    drag.ph.style.width=r.width+"px"; drag.ph.style.height=r.height+"px";
    drag.tile.classList.add("dragging");
  }
  drag.moved=true;
  drag.ghost.style.left=e.clientX+"px";
  drag.ghost.style.top=e.clientY+"px";
  var c=containerAt(e.clientX,e.clientY);
  if(c){
    autoScroll(c, e.clientY);
    placePlaceholder(c, indexAt(c, e.clientX, e.clientY));
  }
  e.preventDefault();
}
function finishDrag(commit){
  window.removeEventListener("pointermove", onMove);
  window.removeEventListener("pointerup", onUp);
  window.removeEventListener("pointercancel", onCancel);
  if(!drag) return;
  var d=drag; drag=null;
  if(!d.active) return false;
  if(d.ghost) d.ghost.remove();
  d.tile.classList.remove("dragging");
  if(commit && d.ph && d.ph.parentElement){
    flip(function(){
      d.ph.parentElement.insertBefore(d.tile, d.ph);
      d.ph.remove();
    });
    d.tile.classList.remove("anim-drop"); void d.tile.offsetWidth; d.tile.classList.add("anim-drop");
  } else if(d.ph){ d.ph.remove(); }
  syncHas();
  if(commit) afterChange();
  return true;
}
function onUp(e){
  if(!drag || e.pointerId!==drag.id) return;
  var wasDrag = drag.active, moved = drag.moved;
  var tile = drag.tile;
  var done = finishDrag(true);
  if(!wasDrag && !moved){ speak(tile.querySelector(".hz").textContent); }
}
function onCancel(){ finishDrag(false); }

function trayUids(){
  var out=[];
  for(var i=0;i<trayEl.children.length;i++){
    var el=trayEl.children[i];
    if(el.classList.contains("tile")) out.push(+el.dataset.uid);
  }
  return out;
}
var autoTimer=null;
function afterChange(){
  clearTimeout(autoTimer);
  if(STATE.solved) return;
  if(trayUids().length===STATE.tokens.length){
    autoTimer=setTimeout(function(){ checkAnswer(true); }, 380);
  }
}

/* ---------- 鍵盤操作 ---------- */
function onKey(e){
  var tile=e.target.closest ? e.target.closest(".tile") : null;
  if(!tile) return;
  var c=tile.parentElement;
  if(e.key===" " || e.key==="Enter"){
    e.preventDefault();
    if(!STATE.solved) speak(tile.querySelector(".hz").textContent);
  } else if(e.key==="ArrowLeft" || e.key==="ArrowRight"){
    e.preventDefault();
    var sibs=[], i;
    for(i=0;i<c.children.length;i++){ if(c.children[i].classList.contains("tile")) sibs.push(c.children[i]); }
    var at=sibs.indexOf(tile), to=at+(e.key==="ArrowRight"?1:-1);
    if(to<0 || to>=sibs.length) return;
    flip(function(){
      if(to>at) c.insertBefore(tile, sibs[to].nextSibling);
      else c.insertBefore(tile, sibs[to]);
    });
    tile.focus(); afterChange();
  } else if(e.key==="ArrowUp" || e.key==="ArrowDown"){
    e.preventDefault();
    var dest = (e.key==="ArrowUp") ? trayEl : bankEl;
    if(dest===c) return;
    flip(function(){ dest.appendChild(tile); });
    tile.focus(); syncHas(); afterChange();
  }
}

/* =====================================================================
   7. 檢查、慶祝
   ===================================================================== */
function checkAnswer(auto){
  if(STATE.solved) return;
  var u=trayUids();
  if(u.length<STATE.tokens.length){
    feedback("還沒有排好喔，再試試看。", false);
    return;
  }
  var ok=true;
  for(var i=0;i<u.length;i++){ if(u[i]!==i){ ok=false; break; } }
  if(ok){ celebrate(); }
  else{
    feedback("再試試看，順序差一點點。", false);
    if(!RM){ trayEl.classList.remove("anim-wobble"); void trayEl.offsetWidth; trayEl.classList.add("anim-wobble"); }
  }
}

function celebrate(){
  STATE.solved=true;
  clearTimeout(autoTimer);
  trayEl.classList.add("solved");
  $("#btnCheck").disabled=true;
  $("#btnReset").disabled=true;
  $("#btnNext").hidden=false;
  feedback("答對了！句子排好了。", true);

  if(!RM){
    var tiles=trayEl.querySelectorAll(".tile");
    for(var i=0;i<tiles.length;i++){
      tiles[i].classList.add("anim-pop", "locked");
      tiles[i].style.animationDelay=(i*38)+"ms";
    }
  } else {
    var ts=trayEl.querySelectorAll(".tile");
    for(var j=0;j<ts.length;j++) ts[j].classList.add("locked");
  }

  cheerEl.classList.add("show");
  setTimeout(function(){ cheerEl.classList.remove("show"); }, 2200);

  if(!RM) confetti();
  setTimeout(function(){ speakSentence(); }, RM?200:780);
}

function confetti(){
  var colors=["#FF5C5C","#4ECDC4","#FFD166","#A78BFA","#FFFDF5"];
  for(var i=0;i<44;i++){
    var p=document.createElement("div");
    p.className="conf";
    var star=Math.random()<0.4;
    var w=star?16:(8+Math.random()*8), h=star?16:(10+Math.random()*12);
    p.style.width=w+"px"; p.style.height=h+"px";
    p.style.left=(Math.random()*100)+"vw";
    p.style.background=colors[(Math.random()*colors.length)|0];
    if(star) p.style.clipPath="polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)";
    p.style.animationDuration=(1.8+Math.random()*1.6)+"s";
    p.style.animationDelay=(Math.random()*0.6)+"s";
    fxEl.appendChild(p);
    (function(el){ setTimeout(function(){ el.remove(); }, 4200); })(p);
  }
}

/* =====================================================================
   8. 按鈕
   ===================================================================== */
trayEl.addEventListener("pointerdown", onDown);
bankEl.addEventListener("pointerdown", onDown);
trayEl.addEventListener("keydown", onKey);
bankEl.addEventListener("keydown", onKey);

$("#btnCheck").addEventListener("click", function(){ checkAnswer(false); });
$("#btnReset").addEventListener("click", function(){
  if(STATE.solved) return;
  flip(function(){
    while(trayEl.children.length) bankEl.appendChild(trayEl.children[0]);
  });
  syncHas(); feedback("回到詞語庫，再排一次。", false);
});
$("#btnNext").addEventListener("click", function(){
  STATE.n++; newPuzzle();
});
$("#btnAgain").addEventListener("click", function(){
  if(!lastSpoken){ feedback("先點一個詞語，就能聽到聲音。", false); return; }
  if(lastSpoken.type==="sentence") speakSentence();
  else speak(lastSpoken.text);
});
[].slice.call(document.querySelectorAll(".scrollbtn")).forEach(function(b){
  b.addEventListener("click", function(){
    bankEl.scrollBy({top: 70*(+b.dataset.dir), behavior: RM?"auto":"smooth"});
  });
});

/* 朗讀設定 */
var sheet=$("#settings");
function updateVoiceInfo(){
  if(!speechOK){ $("#voiceInfo").textContent="目前聲音：不支援朗讀"; $("#speechNote").textContent="這台裝置目前不支援朗讀，可以看著拼音練習。"; return; }
  $("#voiceInfo").textContent = "目前聲音：" + (voice ? (voice.name || "中文聲音") : "尋找中文聲音中…");
  $("#speechNote").textContent = voice ? "會用普通話朗讀詞語和句子。" : "如果找不到中文聲音，可以看著拼音練習。";
}
$("#btnSettings").addEventListener("click", function(){ updateVoiceInfo(); sheet.hidden=false; });
$("#btnClose").addEventListener("click", function(){ sheet.hidden=true; });
sheet.addEventListener("click", function(e){ if(e.target===sheet) sheet.hidden=true; });
$("#btnTest").addEventListener("click", function(){
  if(!speechOK){ updateVoiceInfo(); return; }
  lastSpoken={type:"token", text:"你好，我們一起來玩。"};
  window.speechSynthesis.cancel();
  setTimeout(function(){ var u=new SpeechSynthesisUtterance("你好，我們一起來玩。"); setupUtter(u); window.speechSynthesis.speak(u); },60);
});

window.addEventListener("pointermove", function(e){ if(drag) e.preventDefault(); }, {passive:false});

/* 開始 */
newPuzzle();
})();
