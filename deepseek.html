<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拼音造句樂</title>
<style>
  :root{
    --orange:#ff8a3d;
    --orange-dark:#e8701f;
    --blue:#2a9df4;
    --green:#2fbf71;
    --ink:#3a3a3a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    min-height:100%;
    font-family:"Microsoft JhengHei","PingFang TC","Heiti TC","Noto Sans TC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#e8f7ff 0%,#fff4e6 55%,#ffeef7 100%);
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  body{ user-select:none; -webkit-user-select:none; }

  .app{
    max-width:940px;
    margin:0 auto;
    padding:10px 12px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:100vh;
  }

  header{
    background:#fff;
    border-radius:20px;
    padding:10px 14px;
    box-shadow:0 4px 14px rgba(120,140,180,.16);
    border:2px solid #ffe0bd;
  }
  .toprow{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  h1{
    font-size:22px; margin:0; letter-spacing:2px;
    color:var(--orange-dark);
    text-shadow:0 2px 0 #ffe6cc;
  }
  .score{
    font-size:15px; font-weight:700; color:#fff;
    background:linear-gradient(180deg,#63d2ff,#2a9df4);
    padding:5px 12px; border-radius:999px;
    box-shadow:0 3px 0 #1a7fc7;
    white-space:nowrap;
  }
  .hint{
    margin:6px 0 0; font-size:14px; line-height:1.5; color:#6b7a90;
  }

  .panel-title{
    font-size:13px; color:#8a9bb0; margin:0 0 4px 6px; font-weight:700; letter-spacing:1px;
  }

  /* ---------- drop zones ---------- */
  .dropzone{
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:8px;
    border-radius:20px;
    padding:10px;
    transition:background .15s, border-color .15s, box-shadow .15s;
    min-height:64px;
  }
  .answer{
    min-height:132px;
    background:#ffffffcc;
    border:3px dashed #ffbe6b;
    box-shadow:inset 0 2px 10px rgba(255,180,90,.14);
  }
  .answer.over{
    background:#fff6e2;
    border-color:#ff9f1c;
    box-shadow:0 0 0 5px rgba(255,159,28,.18), inset 0 2px 10px rgba(255,180,90,.2);
  }
  .answer.shake{ animation:shake .45s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-7px); }
    40%{ transform:translateX(7px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(5px); }
  }

  .bank-wrap{
    background:#eaf6ff;
    border-radius:22px;
    border:2px solid #cde8fb;
    padding:8px;
    box-shadow:0 4px 14px rgba(120,140,180,.12);
  }
  .bank{
    max-height:36vh;
    overflow-y:auto;
    border:3px dashed #b9dcf5;
    background:#ffffff9c;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }
  .bank.over{
    background:#f0faff;
    border-color:#7cc6f0;
  }

  /* ---------- bubbles ---------- */
  .bubble{
    position:relative;
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5px 12px 7px;
    background:linear-gradient(180deg,#ffffff,#fff8ef);
    border:2px solid #ffd28a;
    border-radius:16px;
    box-shadow:0 3px 0 #f0c070, 0 5px 12px rgba(160,130,80,.15);
    cursor:grab;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    min-width:52px;
    transition:transform .1s ease;
    will-change:transform;
  }
  .bubble:active{ cursor:grabbing; }
  .bubble .py{
    font-size:13px;
    line-height:1.15;
    color:#e07b39;
    letter-spacing:.4px;
    white-space:nowrap;
    font-family:"Segoe UI",system-ui,Arial,sans-serif;
    font-weight:600;
  }
  .bubble .hz{
    font-size:24px;
    line-height:1.25;
    font-weight:800;
    color:#33404f;
    white-space:nowrap;
    letter-spacing:1px;
  }
  .bubble.punct{
    padding:5px 10px 7px;
    border-color:#d9dee6;
    box-shadow:0 3px 0 #c3cad4, 0 5px 12px rgba(120,130,150,.12);
    min-width:40px;
  }
  .bubble.punct .hz{ color:#7b8798; }
  .bubble .ini{ color:#1565c0; }
  .bubble .fin{ color:#c62828; }
  .bubble.in-answer{
    border-color:#a7e3bd;
    box-shadow:0 3px 0 #86cf9f, 0 5px 12px rgba(90,170,120,.18);
  }
  .bubble.hint-placed{
    animation:hintGlow 1.5s ease-out;
  }
  @keyframes hintGlow{
    0%{ box-shadow:0 0 0 0 rgba(255,200,60,.95), 0 3px 0 #86cf9f; transform:scale(1.15); }
    60%{ box-shadow:0 0 0 10px rgba(255,200,60,0), 0 3px 0 #86cf9f; transform:scale(1.04); }
    100%{ box-shadow:0 3px 0 #86cf9f, 0 5px 12px rgba(90,170,120,.18); transform:scale(1); }
  }

  .ghost{
    position:fixed !important;
    z-index:9999;
    pointer-events:none;
    opacity:.96;
    transform:scale(1.1) rotate(-2deg);
    box-shadow:0 14px 26px rgba(0,0,0,.28) !important;
    margin:0 !important;
  }

  /* ---------- buttons ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding-top:2px;
  }
  button{
    font-family:inherit;
    font-size:17px;
    font-weight:800;
    letter-spacing:1px;
    color:#fff;
    border:none;
    border-radius:16px;
    padding:12px 20px;
    min-height:50px;
    cursor:pointer;
    background:linear-gradient(180deg,#63d2ff,#2a9df4);
    box-shadow:0 4px 0 #1a7fc7, 0 6px 14px rgba(42,157,244,.28);
    transition:transform .08s, box-shadow .08s, filter .15s;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 #1a7fc7; }
  button:disabled{ filter:grayscale(.6) opacity(.55); box-shadow:0 4px 0 #9aa7b6; cursor:default; }
  button.green{ background:linear-gradient(180deg,#6ee7a3,#2fbf71); box-shadow:0 4px 0 #1f9a58, 0 6px 14px rgba(47,191,113,.28); }
  button.green:active{ box-shadow:0 1px 0 #1f9a58; }
  button.orange{ background:linear-gradient(180deg,#ffb367,#ff8a3d); box-shadow:0 4px 0 #d96a1e, 0 6px 14px rgba(255,138,61,.28); }
  button.orange:active{ box-shadow:0 1px 0 #d96a1e; }
  button.gray{ background:linear-gradient(180deg,#c7d3e0,#9fb0c2); box-shadow:0 4px 0 #7d8fa3, 0 6px 14px rgba(120,140,170,.22); }
  button.gray:active{ box-shadow:0 1px 0 #7d8fa3; }
  button.purple{ background:linear-gradient(180deg,#c9a4ff,#9b6bff); box-shadow:0 4px 0 #7a4fd6, 0 6px 14px rgba(155,107,255,.28); }
  button.purple:active{ box-shadow:0 1px 0 #7a4fd6; }
  button.yellow{ background:linear-gradient(180deg,#ffd166,#f4a300); box-shadow:0 4px 0 #c98a00, 0 6px 14px rgba(244,163,0,.28); }
  button.yellow:active{ box-shadow:0 1px 0 #c98a00; }
  @keyframes hintPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }
  button.pulse{ animation:hintPulse 1s infinite; }

  .legend{
    font-size:13px; color:#6b7a90; text-align:center; letter-spacing:.5px;
    display:none;
  }
  .legend.on{ display:block; }
  .legend b.i{ color:#1565c0; }
  .legend b.f{ color:#c62828; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translate(-50%,140%);
    background:rgba(52,64,79,.94);
    color:#fff;
    font-size:16px;
    font-weight:700;
    letter-spacing:1px;
    padding:11px 20px;
    border-radius:999px;
    box-shadow:0 8px 22px rgba(0,0,0,.25);
    transition:transform .28s cubic-bezier(.2,1.4,.4,1);
    z-index:8000;
    max-width:92vw;
    text-align:center;
    pointer-events:none;
  }
  .toast.show{ transform:translate(-50%,0); }

  /* ---------- celebration ---------- */
  .celebrate{
    position:fixed;
    inset:0;
    z-index:9000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(20,30,50,.28);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  .celebrate.show{ opacity:1; pointer-events:auto; }
  .confetti-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .confetti-piece{
    position:absolute;
    top:-12vh;
    display:block;
    animation-name:fall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(125vh) rotate(760deg); opacity:.85; }
  }

  .congrats{
    position:relative;
    background:linear-gradient(180deg,#ffffff,#fff7ec);
    border:4px solid #ffd28a;
    border-radius:28px;
    padding:26px 28px 22px;
    text-align:center;
    box-shadow:0 18px 40px rgba(0,0,0,.22);
    animation:pop .5s cubic-bezier(.2,1.6,.4,1);
    max-width:88vw;
  }
  @keyframes pop{
    0%{ transform:scale(.5) translateY(30px); opacity:0; }
    60%{ transform:scale(1.06); opacity:1; }
    100%{ transform:scale(1); }
  }
  .congrats .big{
    font-size:40px;
    font-weight:900;
    letter-spacing:4px;
    background:linear-gradient(180deg,#ffb347,#ff6f3c);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:bounce 1s infinite;
  }
  @keyframes bounce{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-8px) scale(1.04); }
  }
  .congrats .sub{
    font-size:19px;
    color:#7a8699;
    letter-spacing:2px;
    margin:8px 0 18px;
    font-weight:700;
  }
  .congrats .show-sentence{
    font-size:22px;
    font-weight:800;
    color:#33404f;
    letter-spacing:2px;
    line-height:1.6;
    margin:0 0 16px;
    max-width:80vw;
  }

  @media (max-width:520px){
    h1{ font-size:19px; }
    .bubble .hz{ font-size:21px; }
    .bubble .py{ font-size:11.5px; }
    button{ font-size:15.5px; padding:11px 15px; min-height:46px; }
    .congrats .big{ font-size:32px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="toprow">
      <h1>🫧 拼音造句樂</h1>
      <div class="score" id="score">答對 0 句</div>
    </div>
    <p class="hint">把下面的詞語泡泡，拖到上面的框框裡，排成一句通順的話。<br>點一下泡泡，可以聽聽它的中文發音喔！</p>
  </header>

  <main style="display:flex;flex-direction:column;gap:8px;">
    <section>
      <div id="answer" class="dropzone answer" aria-label="答案區"></div>
    </section>
    <section class="bank-wrap">
      <div id="bank" class="dropzone bank" aria-label="詞語庫"></div>
    </section>
  </main>

  <p class="legend" id="legend">藍色是 <b class="i">聲母</b>，紅色是 <b class="f">韻母</b>。</p>

  <footer class="controls">
    <button id="btnCheck" class="green">檢查答案</button>
    <button id="btnHint" class="yellow">💡 提示</button>
    <button id="btnReset" class="gray">重設</button>
    <button id="btnSpeak" class="orange">再聽一次</button>
    <button id="btnParts" class="purple">顯示聲母韻母</button>
    <button id="btnNext" class="green" style="display:none;">下一題 ➜</button>
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="celebrate" id="celebrate">
  <div class="confetti-layer" id="confetti"></div>
  <div class="congrats">
    <div class="big">太棒了！</div>
    <div class="sub">你排對了，好厲害！</div>
    <p class="show-sentence" id="showSentence"></p>
    <button id="btnNext2" class="green">下一題 ➜</button>
  </div>
</div>

<script>
/* ============================================================
   一、句庫（Traditional Chinese + Hanyu Pinyin with tone marks）
   格式：每個詞用「/」分隔；詞寫成「漢字|pinyin」；標點只有漢字。
   ============================================================ */

const BASE_SENTENCES = [
"今天|jīn tiān/我|wǒ/跟|gēn/爸爸|bà ba/一起|yī qǐ/去|qù/旅行|lǚ xíng/，/非常|fēi cháng/開心|kāi xīn/。",
"媽媽|mā ma/在|zài/廚房|chú fáng/煮|zhǔ/麵|miàn/，/味道|wèi dào/很|hěn/香|xiāng/。",
"爺爺|yé ye/每天|měi tiān/早上|zǎo shang/去|qù/公園|gōng yuán/散步|sàn bù/，/身體|shēn tǐ/很|hěn/健康|jiàn kāng/。",
"奶奶|nǎi nai/說|shuō/故事|gù shì/給|gěi/我|wǒ/聽|tīng/，/我|wǒ/覺得|jué de/很|hěn/溫暖|wēn nuǎn/。",
"姊姊|jiě jie/教|jiāo/我|wǒ/寫|xiě/功課|gōng kè/，/我|wǒ/很|hěn/感謝|gǎn xiè/她|tā/。",
"哥哥|gē ge/和|hé/我|wǒ/一起|yī qǐ/打|dǎ/籃球|lán qiú/，/玩|wán/得|de/很|hěn/快樂|kuài lè/。",
"我們|wǒ men/全家人|quán jiā rén/一起|yī qǐ/吃|chī/晚飯|wǎn fàn/，/氣氛|qì fēn/很|hěn/熱鬧|rè nao/。",
"妹妹|mèi mei/畫|huà/了|le/一|yī/張|zhāng/圖畫|tú huà/，/顏色|yán sè/很|hěn/漂亮|piào liang/。",
"爸爸|bà ba/教|jiāo/我|wǒ/騎|qí/腳踏車|jiǎo tà chē/，/我|wǒ/學|xué/得|de/很|hěn/快|kuài/。",
"外公|wài gōng/帶|dài/我|wǒ/去|qù/釣魚|diào yú/，/我們|wǒ men/都|dōu/很|hěn/開心|kāi xīn/。",

"下課|xià kè/的|de/時候|shí hou/我|wǒ/和|hé/同學|tóng xué/玩|wán/遊戲|yóu xì/，/非常|fēi cháng/開心|kāi xīn/。",

"今天|jīn tiān/的|de/功課|gōng kè/有|yǒu/點|diǎn/難|nán/，/我|wǒ/還是|hái shì/寫|xiě/完|wán/了|le/。",
"小明|xiǎo míng/在|zài/黑板|hēi bǎn/上|shàng/寫|xiě/字|zì/，/字|zì/寫|xiě/得|de/很|hěn/工整|gōng zhěng/。",

"考試|kǎo shì/的|de/時候|shí hou/我|wǒ/很|hěn/緊張|jǐn zhāng/，/但是|dàn shì/我|wǒ/很|hěn/努力|nǔ lì/。",

"奶奶|nǎi nai/做|zuò/的|de/水餃|shuǐ jiǎo/好|hǎo/好吃|hǎo chī/，/我|wǒ/吃|chī/了|le/十|shí/個|gè/。",
"今天|jīn tiān/的|de/晚餐|wǎn cān/有|yǒu/青菜|qīng cài/和|hé/魚|yú/，/營養|yíng yǎng/很|hěn/均衡|jūn héng/。",
"我|wǒ/幫|bāng/媽媽|mā ma/洗|xǐ/水果|shuǐ guǒ/，/媽媽|mā ma/說|shuō/我|wǒ/很|hěn/懂事|dǒng shì/。",
"動物園|dòng wù yuán/裡|li/的|de/大象|dà xiàng/很|hěn/大|dà/，/我|wǒ/看|kàn/得|de/很|hěn/驚訝|jīng yà/。",
"小貓|xiǎo māo/在|zài/沙發|shā fā/上|shàng/睡|shuì/覺|jiào/，/樣子|yàng zi/很|hěn/可愛|kě ài/。",
"小狗|xiǎo gǒu/每天|měi tiān/都|dōu/陪|péi/我|wǒ/去|qù/散步|sàn bù/，/牠|tā/很|hěn/忠心|zhōng xīn/。",
"蝴蝶|hú dié/在|zài/花園|huā yuán/裡|li/飛來飛去|fēi lái fēi qù/，/看起來|kàn qǐ lái/很|hěn/快樂|kuài lè/。",
"我|wǒ/在|zài/海邊|hǎi biān/看到|kàn dào/一|yī/隻|zhī/海龜|hǎi guī/，/牠|tā/游|yóu/得|de/很|hěn/慢|màn/。",
"樹上|shù shàng/的|de/小鳥|xiǎo niǎo/唱|chàng/著|zhe/歌|gē/，/聲音|shēng yīn/很|hěn/好聽|hǎo tīng/。",

  "早晨習慣": ["去跑步|qù pǎo bù","喝一杯水|hē yī bēi shuǐ","做運動|zuò yùn dòng","吃早餐|chī zǎo cān","讀一本書|dú yī běn shū"],
  "健康形容": ["健康|jiàn kāng","好|hǎo","棒|bàng","強壯|qiáng zhuàng"]
};

const TEMPLATES = [
"今天|jīn tiān/我|wǒ/跟|gēn/{人物}/一起|yī qǐ/去|qù/{地點}/，/非常|fēi cháng/{感受}/。",
"昨天|zuó tiān/我|wǒ/和|hé/{人物}/一起|yī qǐ/{活動}/，/覺得|jué de/很|hěn/{感受}/。",
"媽媽|mā ma/在|zài/廚房|chú fáng/煮|zhǔ/{煮食}/，/味道|wèi dào/很|hěn/{香形容}/。",
"我|wǒ/最|zuì/喜歡|xǐ huān/吃|chī/{食物}/，/因為|yīn wèi/它|tā/很|hěn/{好吃形容}/。",
"動物園|dòng wù yuán/裡|li/的|de/{動物}/很|hěn/{動物形容}/，/我|wǒ/看|kàn/得|de/很|hěn/{感受}/。",
"今天|jīn tiān/的|de/天氣|tiān qì/很|hěn/{天氣形容}/，/我|wǒ/想|xiǎng/去|qù/{戶外活動}/。",
"我|wǒ/和|hé/{人物}/一起|yī qǐ/去|qù/山上|shān shàng/看|kàn/星星|xīng xing/，/覺得|jué de/很|hěn/{感受}/。",
"我|wǒ/在|zài/學校|xué xiào/學|xué/{科目}/，/覺得|jué de/很|hěn/{科目形容}/。",
"今天|jīn tiān/我|wǒ/幫|bāng/媽媽|mā ma/{家事}/，/媽媽|mā ma/說|shuō/我|wǒ/很|hěn/{讚美}/。",
"今天|jīn tiān/我|wǒ/的|de/心情|xīn qíng/很|hěn/好|hǎo/，/因為|yīn wèi/我|wǒ/{好事}/。",
"週末|zhōu mò/我|wǒ/和|hé/家人|jiā rén/一起|yī qǐ/去|qù/{地點}/，/玩|wán/得|de/很|hěn/{感受}/。",
"我|wǒ/每天|měi tiān/早上|zǎo shang/都|dōu/會|huì/{早晨習慣}/，/身體|shēn tǐ/很|hěn/{健康形容}/。",
"我|wǒ/在|zài/圖書館|tú shū guǎn/看|kàn/了|le/一|yī/本|běn/{書類}/，/覺得|jué de/很|hěn/{書形容}/。",
"{節日}/那天|nà tiān/我們|wǒ men/全家|quán jiā/一起|yī qǐ/吃飯|chī fàn/，/非常|fēi cháng/{感受}/。",
"我|wǒ/和|hé/{人物}/一起|yī qǐ/{一起做的事}/，/我們|wǒ men/都|dōu/很|hěn/{感受}/。",
"今天|jīn tiān/的|de/天空|tiān kōng/很|hěn/{天空形容}/，/看|kàn/起來|qǐ lái/很|hěn/{感受}/。",
"我|wǒ/最|zuì/喜歡|xǐ huān/的|de/動物|dòng wù/是|shì/{動物}/，/因為|yīn wèi/牠|tā/很|hěn/{動物形容}/。",
"晚上|wǎn shang/睡覺|shuì jiào/前|qián/我|wǒ/會|huì/{睡前活動}/，/覺得|jué de/很|hěn/{放鬆形容}/。",
"我|wǒ/用|yòng/零用錢|líng yòng qián/買|mǎi/了|le/{買的東西}/，/覺得|jué de/很|hěn/{感受}/。",
"{人物}/說|shuō/我|wǒ/是|shì/一|yī/個|gè/{讚美孩子}/的|de/孩子|hái zi/，/我|wǒ/很|hěn/開心|kāi xīn/。"
];

/* ============================================================
   三、工具函式
   ============================================================ */

const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parseSentence(str){
  return str.split('/').map(tok => {
    const i = tok.indexOf('|');
    if (i === -1) return { text: tok, pinyin: '' };
    return { text: tok.slice(0, i), pinyin: tok.slice(i + 1) };
  });
}

let recentSentences = [];

function expandTemplate(){
  const t = pick(TEMPLATES);
  return t.replace(/\{([^}]+)\}/g, (m, name) => {
    const opts = SLOTS[name];
    if (!opts) return m;
    return pick(opts);
  });
}

function pickSentenceString(){
  for (let k = 0; k < 40; k++){
    const s = Math.random() < 0.55 ? pick(BASE_SENTENCES) : expandTemplate();
    if (recentSentences.indexOf(s) === -1){
      recentSentences.push(s);
      if (recentSentences.length > 30) recentSentences.shift();
      return s;
    }
  }
  return expandTemplate();
}

/* ---- 聲母 / 韻母 切分 ---- */
const INITIALS = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];

function splitSyllable(syl){
  const low = syl.toLowerCase();
  for (const ini of INITIALS){
    if (low.startsWith(ini)) return [syl.slice(0, ini.length), syl.slice(ini.length)];
  }
  return ['', syl];
}

function renderPinyinHTML(pinyin, showParts){
  if (!pinyin) return '';
  if (!showParts) return esc(pinyin);
  return pinyin.split(' ').map(syl => {
    const parts = splitSyllable(syl);
    return '<span class="ini">' + esc(parts[0]) + '</span><span class="fin">' + esc(parts[1]) + '</span>';
  }).join(' ');
}

/* ============================================================
   四、語音（Web Speech API）
   ============================================================ */

let speechOK = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');
let voiceList = [];

function loadVoices(){
  if (!speechOK) return;
  try { voiceList = window.speechSynthesis.getVoices() || []; } catch(e){ voiceList = []; }
}

if (speechOK){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(){
  if (!voiceList.length) loadVoices();
  const prefs = ['zh-TW','zh-CN','zh-HK','zh'];
  const norm = v => (v.lang || '').replace('_','-').toLowerCase();
  for (const p of prefs){
    const found = voiceList.find(v => norm(v).indexOf(p.toLowerCase()) === 0);
    if (found) return found;
  }
  return voiceList.find(v => norm(v).indexOf('zh') === 0) || null;
}

function makeUtterance(text, rate){
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'zh-TW'; }
  u.rate = rate || 0.85;
  u.pitch = 1.05;
  u.volume = 1;
  return u;
}

function speakText(text, rate){
  if (!speechOK){
    toast('這個裝置不支援語音朗讀喔！');
    return;
  }
  try{
    window.speechSynthesis.cancel();
    setTimeout(() => {
      try { window.speechSynthesis.speak(makeUtterance(text, rate)); } catch(e){}
    }, 70);
  } catch(e){
    toast('這個裝置不支援語音朗讀喔！');
  }
}

/* 整句朗讀：在標點處自然停頓 */
function speakFullSentence(tokens){
  if (!speechOK){ toast('這個裝置不支援語音朗讀喔！'); return; }
  try{ window.speechSynthesis.cancel(); } catch(e){}
  const chunks = [];
  let cur = '';
  for (const t of tokens){
    cur += t.text;
    if (/[，。！？、；：]/.test(t.text)){ chunks.push(cur); cur = ''; }
  }
  if (cur.trim()) chunks.push(cur);
  setTimeout(() => {
    chunks.forEach(c => {
      try { window.speechSynthesis.speak(makeUtterance(c, 0.82)); } catch(e){}
    });
  }, 80);
}

/* ============================================================
   五、遊戲狀態與 DOM
   ============================================================ */

const bank = $('bank');
const answer = $('answer');
const scoreEl = $('score');
const btnCheck = $('btnCheck');
const btnHint = $('btnHint');
const btnReset = $('btnReset');
const btnSpeak = $('btnSpeak');
const btnParts = $('btnParts');
const btnNext = $('btnNext');
const btnNext2 = $('btnNext2');
const celebrate = $('celebrate');
const confettiLayer = $('confetti');
const showSentenceEl = $('showSentence');
const legendEl = $('legend');
const toastEl = $('toast');

let currentTokens = [];
let locked = false;
let score = 0;
let showParts = false;
let wrongAttempts = 0;

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2100);
}

/* ---------- 建立題目 ---------- */
function newQuestion(){
  locked = false;
  wrongAttempts = 0;
  btnHint.classList.remove('pulse');
  celebrate.classList.remove('show');
  btnNext.style.display = 'none';
  answer.innerHTML = '';
  bank.innerHTML = '';

  currentTokens = parseSentence(pickSentenceString());

  const order = currentTokens.map((_, i) => i);
  shuffle(order);

  order.forEach(i => {
    const t = currentTokens[i];
    const el = document.createElement('div');
    el.className = 'bubble' + (t.pinyin ? '' : ' punct');
    el.dataset.idx = i;
    el.dataset.text = t.text;
    el.dataset.pinyin = t.pinyin;
    el.innerHTML = t.pinyin
      ? '<div class="py">' + renderPinyinHTML(t.pinyin, showParts) + '</div><div class="hz">' + esc(t.text) + '</div>'
      : '<div class="hz">' + esc(t.text) + '</div>';
    el.addEventListener('pointerdown', onPointerDown);
    bank.appendChild(el);
  });

  updateZoneStyles();
}

/* ---------- 拖曳（Pointer Events，支援觸控與滑鼠） ---------- */
const DRAG_THRESHOLD = 8;
let drag = null;

function onPointerDown(e){
  if (locked) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  const el = e.currentTarget;
  const rect = el.getBoundingClientRect();

  drag = {
    el: el,
    id: e.pointerId,
    sx: e.clientX,
    sy: e.clientY,
    ox: e.clientX - rect.left,
    oy: e.clientY - rect.top,
    w: rect.width,
    h: rect.height,
    moved: false,
    ghost: null
  };

  try { el.setPointerCapture(e.pointerId); } catch(err){}

  el.addEventListener('pointermove', onPointerMove);
  el.addEventListener('pointerup', onPointerUp);
  el.addEventListener('pointercancel', onPointerUp);

  e.preventDefault();
}

function startGhost(){
  const el = drag.el;
  const rect = el.getBoundingClientRect();
  const g = el.cloneNode(true);
  g.classList.add('ghost');
  g.style.left = rect.left + 'px';
  g.style.top = rect.top + 'px';
  g.style.width = rect.width + 'px';
  g.style.height = rect.height + 'px';
  document.body.appendChild(g);
  drag.ghost = g;
  el.style.visibility = 'hidden';
}

function moveGhost(x, y){
  if (!drag || !drag.ghost) return;
  drag.ghost.style.left = (x - drag.ox) + 'px';
  drag.ghost.style.top = (y - drag.oy) + 'px';
}

function onPointerMove(e){
  if (!drag || e.pointerId !== drag.id) return;

  if (!drag.moved){
    const dx = e.clientX - drag.sx;
    const dy = e.clientY - drag.sy;
    if (Math.sqrt(dx * dx + dy * dy) < DRAG_THRESHOLD) return;
    drag.moved = true;
    startGhost();
  }

  moveGhost(e.clientX, e.clientY);
  highlightZone(e.clientX, e.clientY);
  e.preventDefault();
}

function highlightZone(x, y){
  const el = document.elementFromPoint(x, y);
  const zone = el ? el.closest('.dropzone') : null;
  answer.classList.toggle('over', zone === answer);
  bank.classList.toggle('over', zone === bank);
}

function getInsertBefore(container, x, y, skip){
  const kids = Array.prototype.slice.call(container.children)
    .filter(c => c !== skip && c.classList && c.classList.contains('bubble'));
  for (const c of kids){
    const r = c.getBoundingClientRect();
    if (y < r.top) return c;
    if (y <= r.bottom && x < r.left + r.width / 2) return c;
  }
  return null;
}

function onPointerUp(e){
  if (!drag || e.pointerId !== drag.id) return;

  const el = drag.el;
  const moved = drag.moved;

  el.removeEventListener('pointermove', onPointerMove);
  el.removeEventListener('pointerup', onPointerUp);
  el.removeEventListener('pointercancel', onPointerUp);
  try { el.releasePointerCapture(e.pointerId); } catch(err){}

  const x = e.clientX, y = e.clientY;

  let zone = null;
  if (moved){
    const target = document.elementFromPoint(x, y);
    zone = target ? target.closest('.dropzone') : null;
  }

  if (drag.ghost){ drag.ghost.remove(); drag.ghost = null; }
  el.style.visibility = '';

  if (moved && zone){
    const before = getInsertBefore(zone, x, y, el);
    if (before) zone.insertBefore(el, before);
    else zone.appendChild(el);
    updateZoneStyles();
    maybeAutoCheck();
  } else if (!moved){
    // 點一下 = 聽發音
    const text = el.dataset.text;
    if (el.dataset.pinyin){
      speakText(text, 0.78);
    } else {
      speakText(text, 0.9);
    }
  }

  answer.classList.remove('over');
  bank.classList.remove('over');
  drag = null;
}

/* ---------- 狀態更新 ---------- */
function updateZoneStyles(){
  Array.prototype.forEach.call(answer.children, c => c.classList.add('in-answer'));
  Array.prototype.forEach.call(bank.children, c => c.classList.remove('in-answer'));
}

function maybeAutoCheck(){
  if (locked) return;
  if (bank.children.length === 0 && answer.children.length === currentTokens.length){
    setTimeout(checkAnswer, 220);
  }
}

/* ---------- 檢查答案 ---------- */
function checkAnswer(){
  if (locked) return;

  const kids = Array.prototype.slice.call(answer.children);
  if (kids.length !== currentTokens.length){
    toast('還有泡泡沒有放上去喔！');
    return;
  }

  let ok = true;
  for (let i = 0; i < kids.length; i++){
    if (Number(kids[i].dataset.idx) !== i){ ok = false; break; }
  }

  if (ok){
    onCorrect();
  } else {
    wrongAttempts++;
    if (wrongAttempts >= 2) btnHint.classList.add('pulse');
    toast('再想想看，把泡泡的順序調整一下吧！');
    answer.classList.add('shake');
    setTimeout(() => answer.classList.remove('shake'), 500);
  }
}

/* ---------- 提示：自動放上一個正確泡泡 ---------- */
function giveHint(){
  if (locked) return;

  const kids = Array.prototype.slice.call(answer.children);

  // 找出第一個還沒放對的位置
  let targetIdx = 0;
  while (targetIdx < currentTokens.length &&
         kids[targetIdx] &&
         Number(kids[targetIdx].dataset.idx) === targetIdx){
    targetIdx++;
  }

  if (targetIdx >= currentTokens.length){
    toast('已經排對啦！按「檢查答案」看看。');
    return;
  }

  // 找出正確位置對應的泡泡
  let target = null;
  const all = document.querySelectorAll('.bubble');
  for (const el of all){
    if (Number(el.dataset.idx) === targetIdx){ target = el; break; }
  }
  if (!target) return;

  // 移到答案區的正確位置
  target.remove();
  const ref = answer.children[targetIdx] || null;
  answer.insertBefore(target, ref);
  updateZoneStyles();

  // 提示泡泡的高亮動畫
  target.classList.remove('hint-placed');
  void target.offsetWidth;
  target.classList.add('hint-placed');
  setTimeout(() => target.classList.remove('hint-placed'), 1600);

  // 唸出提示的詞
  if (target.dataset.pinyin) speakText(target.dataset.text, 0.78);

  toast('💡 提示：幫你放好一個泡泡囉！');

  maybeAutoCheck();
}

function onCorrect(){
  locked = true;
  btnHint.classList.remove('pulse');
  score++;
  scoreEl.textContent = '答對 ' + score + ' 句';

  const full = currentTokens.map(t => t.text).join('');
  showSentenceEl.textContent = full;

  launchConfetti();
  celebrate.classList.add('show');
  btnNext.style.display = '';
  btnNext2.style.display = '';

  setTimeout(() => speakFullSentence(currentTokens), 480);
}

/* ---------- 五彩紙花 ---------- */
function launchConfetti(){
  confettiLayer.innerHTML = '';
  const colors = ['#ffd166','#ef476f','#06d6a0','#118ab2','#f78c6b','#c77dff','#ff9f1c','#4cc9f0'];
  const count = 80;
  for (let i = 0; i < count; i++){
    const p = document.createElement('i');
    p.className = 'confetti-piece';
    const size = 7 + Math.random() * 9;
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = colors[i % colors.length];
    p.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
    p.style.animationDelay = (Math.random() * 0.9) + 's';
    p.style.animationDuration = (1.7 + Math.random() * 1.5) + 's';
    confettiLayer.appendChild(p);
  }
  setTimeout(() => { confettiLayer.innerHTML = ''; }, 4200);
}

/* ---------- 按鈕事件 ---------- */
btnCheck.addEventListener('click', checkAnswer);

btnHint.addEventListener('click', giveHint);

btnReset.addEventListener('click', () => {
  if (locked) return;
  const all = Array.prototype.slice.call(answer.children).concat(Array.prototype.slice.call(bank.children));
  answer.innerHTML = '';
  bank.innerHTML = '';
  shuffle(all).forEach(el => bank.appendChild(el));
  updateZoneStyles();
  toast('已經重新排好囉，再試一次吧！');
});

btnSpeak.addEventListener('click', () => {
  const kids = Array.prototype.slice.call(answer.children);
  if (!kids.length){
    toast('先把泡泡放到上面的框框吧！');
    return;
  }
  const tokens = kids.map(el => ({ text: el.dataset.text }));
  speakFullSentence(tokens);
});

btnParts.addEventListener('click', () => {
  showParts = !showParts;
  btnParts.textContent = showParts ? '隱藏聲母韻母' : '顯示聲母韻母';
  legendEl.classList.toggle('on', showParts);
  const all = document.querySelectorAll('.bubble');
  Array.prototype.forEach.call(all, el => {
    const py = el.dataset.pinyin;
    const pyEl = el.querySelector('.py');
    if (pyEl && py) pyEl.innerHTML = renderPinyinHTML(py, showParts);
  });
});

function goNext(){
  newQuestion();
}

btnNext.addEventListener('click', goNext);
btnNext2.addEventListener('click', goNext);

/* 避免在拖曳時選取文字或長按選單 */
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.bubble')) e.preventDefault();
});
document.addEventListener('gesturestart', e => e.preventDefault());

/* 啟動遊戲 */
newQuestion();
</script>
